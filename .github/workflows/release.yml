name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build · ${{ matrix.name }}
    permissions:
      contents: read
      actions: read
    # Code signing switches on by itself once its secrets / variables exist (docs/code-signing.md).
    env:
      MAC_SIGNING: ${{ secrets.MAC_CERTS != '' }}
      MAC_NOTARIZE: ${{ secrets.APPLE_API_KEY_P8 != '' }}
      WIN_SIGNPATH: ${{ vars.SIGNPATH_PROJECT_SLUG != '' && secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            smoke: release/win-unpacked/jysvhera.exe
          - name: macOS
            os: macos-latest
            target: --mac
            smoke: release/mac-arm64/JYSV HERA.app/Contents/MacOS/JYSV HERA
          - name: Linux
            os: ubuntu-22.04
            target: --linux
            smoke: release/linux-unpacked/jysvhera
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # node-pty ships no Linux binary. Build it on Debian 11 (glibc 2.31) so it loads on
      # every distro Electron itself supports: Ubuntu 20.04+, Debian 11+, Fedora, Rocky / Alma / RHEL 9+.
      - name: Build node-pty for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm xvfb
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/w" -w /w/node_modules/node-pty node:22-bullseye \
            bash -c "npx --yes node-gyp@11.2.0 rebuild && mkdir -p prebuilds/linux-x64 && cp build/Release/pty.node prebuilds/linux-x64/"
          echo "newest glibc symbol needed:"
          objdump -T node_modules/node-pty/prebuilds/linux-x64/pty.node | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Make spawn-helper executable
        if: runner.os == 'macOS'
        run: chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper

      - run: npm run typecheck
      - run: npm run build

      - name: Apple notarization key
        if: runner.os == 'macOS' && env.MAC_NOTARIZE == 'true'
        run: printf '%s' "$KEY" > "$RUNNER_TEMP/apple-api-key.p8"
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: Package
        if: runner.os != 'Windows' || env.WIN_SIGNPATH != 'true'
        run: npx electron-builder ${{ matrix.target }} --publish never --config scripts/builder-config.cjs
        env:
          # macOS: Developer ID signing and notarization only when the secrets exist; ad-hoc otherwise.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && env.MAC_SIGNING == 'true' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTS || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTS_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && env.MAC_NOTARIZE == 'true' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}

      # Windows signed through SignPath: sign the app, build the installer and zip from the
      # signed app, then sign the installer, so both the installer and the installed
      # jysvhera.exe carry the signature.
      - name: Package app (Windows, to sign)
        if: runner.os == 'Windows' && env.WIN_SIGNPATH == 'true'
        run: npx electron-builder --win --dir --publish never --config scripts/builder-config.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload app for signing
        id: unsigned-app
        if: runner.os == 'Windows' && env.WIN_SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: release/win-unpacked

      - name: Sign app (SignPath)
        if: runner.os == 'Windows' && env.WIN_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          output-artifact-directory: release/win-unpacked

      - name: Package installer from the signed app
        if: runner.os == 'Windows' && env.WIN_SIGNPATH == 'true'
        shell: bash
        run: |
          mv release/win-unpacked release/win-signed
          npx electron-builder --win --prepackaged release/win-signed --publish never --config scripts/builder-config.cjs
          mv release/win-signed release/win-unpacked
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer for signing
        id: unsigned-installer
        if: runner.os == 'Windows' && env.WIN_SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: release/*.exe

      - name: Sign installer (SignPath)
        if: runner.os == 'Windows' && env.WIN_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          output-artifact-directory: release

      - name: Signature check
        if: runner.os == 'Windows' && env.WIN_SIGNPATH == 'true'
        shell: pwsh
        run: |
          foreach ($file in @(Get-Item release/*.exe) + @(Get-Item release/win-unpacked/jysvhera.exe)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            "$($file.Name): $($signature.Status) $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { exit 1 }
          }

      - name: Self-test (real terminal, hera CLI, window)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a scripts/smoke.sh "${{ matrix.smoke }}" --no-sandbox
          else
            scripts/smoke.sh "${{ matrix.smoke }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hera-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release notes (docs/patch-notes/{en,ko}/<tag>.md)
        run: node scripts/patch-notes.mjs body "${{ github.ref_name }}" > release-body.md

      - name: Checksums
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed (Sigstore) statement that each file was built by this workflow from this
      # tag's source. Check a download with: gh attestation verify <file> --repo jysvai/JYSV-HERA
      - name: Build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*

      - uses: softprops/action-gh-release@v2
        with:
          name: JYSV HERA ${{ github.ref_name }}
          body_path: release-body.md
          files: out/*
          make_latest: true
